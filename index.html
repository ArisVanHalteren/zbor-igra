<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zbor Igra</title>
<meta name="description" content="A Macedonian word game: match, pick and build your way through 17 units.">
<meta name="theme-color" content="#5e0b0d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zbor Igra">
<style>/* Layout: one phone-width column on a crimson field (the flag), cream cards; home = player card, play buttons, zigzag unit map. Rounds take over the screen. Deliberately single-theme. */
:root{
  --bg:#8e1414;
  --bg-deep:#5e0b0d;
  --on-bg:#fff3d6;
  --on-bg-muted:#f2c9a8;
  --card:#fff6e3;
  --card-2:#fdecc8;
  --ink:#2b1608;
  --muted:#86634c;
  --line:#ebd6b0;
  --gold:#ffc929;
  --gold-deep:#c98b00;
  --good:#1d9450;
  --good-soft:#d8f3e2;
  --bad:#d8322a;
  --bad-soft:#ffe0da;
  --lock:#b98d80;
  --font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI Rounded",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg-deep);background-image:radial-gradient(120% 70% at 50% 0%, var(--bg) 0%, var(--bg-deep) 100%);background-attachment:fixed;color:var(--on-bg);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;min-height:100%}
svg{display:block}
.num{font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:18px;font-weight:900;font-size:1.08rem;letter-spacing:.01em;background:var(--gold);color:var(--ink);box-shadow:0 5px 0 var(--gold-deep);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gold-deep)}
.btn.cream{background:var(--card);box-shadow:0 5px 0 var(--line)}
.btn.cream:active{box-shadow:0 1px 0 var(--line)}
.btn.good{background:var(--good);color:#fff;box-shadow:0 5px 0 #0f6a36}
.btn.danger{background:var(--bad);color:#fff;box-shadow:0 5px 0 #8f1a14}
.btn:disabled{opacity:.5;transform:none}
.btn small{font-weight:700;opacity:.75;font-size:.85rem}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.15rem;letter-spacing:.01em}
.brand small{display:block;font-weight:700;font-size:.72rem;color:var(--on-bg-muted);letter-spacing:.04em}
.iconbtn{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.iconbtn svg{width:22px;height:22px}

/* player card */
.player{background:var(--card);color:var(--ink);border-radius:24px;padding:16px;display:grid;gap:12px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.prow{display:flex;align-items:center;gap:14px}
.medal{width:62px;height:62px;flex:none;border-radius:50%;background:var(--gold);box-shadow:inset 0 -5px 0 var(--gold-deep), 0 0 0 4px var(--card-2);display:grid;place-items:center;font-weight:900;font-size:1.6rem;color:var(--ink)}
.ptitle{min-width:0;flex:1}
.ptitle b{display:block;font-size:1.15rem;font-weight:900}
.ptitle span{font-weight:700;color:var(--muted);font-size:.85rem}
.xpbar{height:14px;border-radius:7px;background:var(--line);overflow:hidden;margin-top:6px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffdf70);border-radius:7px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{background:var(--card-2);border-radius:14px;padding:8px 6px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:900;font-size:1rem;min-width:0}
.chip svg{width:20px;height:20px;flex:none}
.chip span{font-weight:700;font-size:.72rem;color:var(--muted);display:block;line-height:1}
.chip > div{min-width:0}

.playrow{display:grid;gap:12px;margin:16px 0 6px}
.side{display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.18);border-radius:20px;padding:12px 14px}
.side b{display:block;font-weight:900;font-size:1.05rem}
.side span{font-weight:700;color:var(--on-bg-muted);font-size:.85rem}
.side .btn{width:auto;padding:11px 16px;font-size:.98rem;flex:none}
.side.tricky{background:rgba(255,201,41,.14);border-color:rgba(255,201,41,.45)}

/* map */
.maph{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 6px;font-weight:900;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--on-bg-muted)}
.map{position:relative;display:grid;gap:4px;padding-block:6px}
.stop{display:flex;flex-direction:column;align-items:center;width:132px;gap:4px;position:relative}
.stop.l{justify-self:start;margin-left:12%}
.stop.c{justify-self:center}
.stop.r{justify-self:end;margin-right:12%}
.node{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1.5rem;background:var(--card);color:var(--ink);box-shadow:0 7px 0 var(--line), 0 0 0 5px rgba(255,255,255,.08);transition:transform .1s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--line)}
.node.cur{background:var(--gold);box-shadow:0 7px 0 var(--gold-deep), 0 0 0 7px rgba(255,201,41,.3);animation:bob 1.8s ease-in-out infinite}
.node.done3{background:var(--good);color:#fff;box-shadow:0 7px 0 #0f6a36}
.node.locked{background:rgba(255,255,255,.1);color:var(--lock);box-shadow:0 7px 0 rgba(0,0,0,.2)}
.node svg{width:30px;height:30px}
.stars{display:flex;gap:2px}
.stars svg{width:18px;height:18px}
.sname{font-weight:800;font-size:.82rem;text-align:center;line-height:1.15;color:var(--on-bg)}
.stop.lockd .sname{color:var(--lock)}
.tag-cur{position:absolute;top:-30px;background:var(--card);color:var(--ink);font-weight:900;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:10px;white-space:nowrap}
.tag-cur::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--card)}
.trail{position:absolute;inset:0;pointer-events:none;z-index:0}
.stop{z-index:1}
@keyframes bob{50%{transform:translateY(-5px)}}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(30,5,5,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:86%;overflow:auto;animation:up .2s cubic-bezier(.2,.8,.2,1)}
.sheet h2{margin:0;font-size:1.4rem;font-weight:900}
.sheet .sub{color:var(--muted);font-weight:700;margin:2px 0 12px}
.sheet .row{display:flex;gap:10px;margin-bottom:14px}
.sheet .row > div{flex:1;background:var(--card-2);border-radius:14px;padding:8px 10px;text-align:center;font-weight:900}
.sheet .row span{display:block;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.wl{list-style:none;margin:14px 0 0;padding:0;border-top:2px solid var(--line)}
.wl li{display:flex;justify-content:space-between;gap:12px;padding:8px 2px;border-bottom:1px solid var(--line)}
.wl li > div{min-width:0}
.wl .en{color:var(--muted);font-weight:700;text-align:right;font-size:.9rem}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}

/* Macedonian text */
.mk{font-weight:900}
.cy{display:block;font-weight:700;font-size:.72em;color:var(--muted);margin-top:1px}
.hide-cyr .cy{display:none!important}

/* streak */
.streak{background:var(--card-2);border-radius:18px;padding:12px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}
.sbig{display:flex;align-items:center;gap:8px}
.sbig svg{width:38px;height:38px;flex:none}
.sbig b{display:block;font-size:1.6rem;font-weight:900;line-height:1}
.sbig span{display:block;font-size:.72rem;font-weight:800;color:var(--muted);letter-spacing:.02em}
.week{grid-column:1/-1;display:flex;justify-content:space-between;gap:2px;background:var(--card);border-radius:12px;padding:6px 8px}
.wd{display:grid;justify-items:center;font-size:.66rem;font-weight:900;color:var(--muted);width:30px}
.wd svg{width:22px;height:22px}
.wd.today span{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.wd.fut{opacity:.55}
.snote{grid-column:1/-1;margin:0;font-weight:800;font-size:.85rem;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* status pills */
.st{display:block;font-style:normal;font-size:.68rem;font-weight:900;letter-spacing:.05em;text-transform:uppercase;margin-top:2px}
.st.known{color:var(--good)} .st.learning{color:var(--gold-deep)} .st.tricky{color:var(--bad)} .st.new{color:var(--lock)}

/* flashcards */
.fcount{font-weight:900;font-size:.9rem;color:var(--on-bg-muted);min-width:44px;text-align:right}
.fcard{position:relative;height:min(52vh,380px);margin-bottom:16px;perspective:1200px;cursor:pointer;outline:none}
.fcard .face{position:absolute;inset:0;background:var(--card);color:var(--ink);border-radius:26px;box-shadow:0 7px 0 rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.fcard .back{transform:rotateY(180deg);background:#fffaf0}
.fcard.flip .front{transform:rotateY(-180deg)}
.fcard.flip .back{transform:rotateY(0)}
.fcard:focus-visible .face{outline:3px solid var(--gold);outline-offset:3px}
.fcard .big{font-size:clamp(2rem,10vw,3rem);font-weight:900;line-height:1.15;overflow-wrap:anywhere}
.fcard .big.s{font-size:clamp(1.35rem,6.5vw,2rem)}
.fcard .big .cy{font-size:.45em;margin-top:8px}
.ftag{position:absolute;top:16px;left:16px;font-size:.7rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fmk{font-size:1.15rem}
.hint{margin:0;font-weight:700;font-size:.85rem;color:var(--muted)}

/* tap a word for its meaning */
.def{border-bottom:2px dotted rgba(134,99,76,.55);cursor:pointer}
.fb .def{border-bottom-color:rgba(43,22,8,.35)}
.defpop{position:fixed;z-index:50;max-width:260px;background:var(--ink);color:#fff3d6;border-radius:12px;padding:8px 12px;font-weight:700;font-size:.92rem;box-shadow:0 8px 20px rgba(0,0,0,.35);animation:fade .12s;pointer-events:none}
.defpop b{color:var(--gold);margin-right:4px}

/* mistake explanation */
.fbl{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;background:#fff;border-radius:14px;padding:10px 12px;font-weight:700;line-height:1.45}
.fbl i{font-style:normal;font-weight:900;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.85rem}
.fbl.ok i{background:var(--good)} .fbl.no i{background:var(--bad)}
.fbl .cy{display:inline;font-size:.82em;margin:0 2px}
.fbl .eq{color:var(--muted);font-weight:700}
.tip{font-size:.8rem!important;color:var(--muted);font-weight:700!important}
.relaxtag{background:var(--good);color:#fff;font-weight:900;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:10px}
.wt.good{background:var(--good);color:#fff;box-shadow:0 4px 0 #0f6a36}
.wt.good .cy{color:#d5f5e2}

/* my words */
.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.vt{background:var(--card);color:var(--ink);border-radius:16px;padding:10px 4px;display:grid;justify-items:center;gap:2px;box-shadow:0 4px 0 rgba(0,0,0,.18);border:3px solid transparent}
.vt b{font-size:1.4rem;font-weight:900}
.vt span{font-size:.7rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.vt.known b{color:var(--good)} .vt.learning b{color:var(--gold-deep)} .vt.tricky b{color:var(--bad)} .vt.new b{color:var(--lock)}
.vt.on{border-color:var(--gold)}
.vbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:rgba(0,0,0,.25);margin-bottom:8px}
.vbar i{display:block;height:100%}
.vbar .known{background:var(--good)} .vbar .learning{background:var(--gold)} .vbar .tricky{background:#ff7a4d}
.vnote{margin:0 0 14px;font-weight:700;color:var(--on-bg-muted);font-size:.9rem}
.linkbtn{color:var(--gold);font-weight:900;text-decoration:underline}
.toast .tic{width:40px;height:40px;border-radius:50%;background:var(--gold);display:grid;place-items:center;flex:none}
.toast .tic svg{width:24px;height:24px}

/* round HUD */
.hud{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.quit{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.12)}
.quit svg{width:18px;height:18px}
.hearts{display:flex;gap:3px}
.hearts svg{width:24px;height:24px;transition:transform .2s}
.hearts .lost{opacity:.3;transform:scale(.8)}
.hearts .hit{animation:hit .5s}
.rprog{flex:1;height:12px;border-radius:6px;background:rgba(0,0,0,.25);overflow:hidden}
.rprog i{display:block;height:100%;background:var(--card);border-radius:6px;transition:width .3s}
.scorebox{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;min-height:34px}
.score{font-weight:900;font-size:1.5rem}
.score small{font-size:.75rem;font-weight:800;color:var(--on-bg-muted);letter-spacing:.06em;text-transform:uppercase;margin-left:4px}
.combo{display:flex;align-items:center;gap:4px;background:var(--gold);color:var(--ink);font-weight:900;padding:4px 12px;border-radius:99px;font-size:1rem;opacity:0;transform:scale(.7);transition:opacity .2s, transform .2s}
.combo.on{opacity:1;transform:scale(1)}
.combo.pulse{animation:pulse .35s}
.combo svg{width:16px;height:16px}
.timer{height:8px;border-radius:4px;background:rgba(0,0,0,.25);overflow:hidden;margin-bottom:16px}
.timer i{display:block;height:100%;width:100%;background:var(--gold);border-radius:4px}
.timer i.low{background:#ff7a4d}
.floater{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-weight:900;font-size:2rem;color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.25);pointer-events:none;animation:floatup .9s forwards;z-index:30}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-50px) scale(1)}}
@keyframes pulse{50%{transform:scale(1.25)}}
@keyframes hit{30%{transform:scale(1.4) rotate(-12deg)}}

/* challenge card */
.qlabel{font-weight:900;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--on-bg-muted);margin:0 0 8px}
.qcard{background:var(--card);color:var(--ink);border-radius:24px;padding:24px 16px;text-align:center;margin-bottom:16px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.qcard .big{font-size:clamp(1.8rem,8.5vw,2.6rem);font-weight:900;line-height:1.15;overflow-wrap:anywhere}
.qcard .big.s{font-size:clamp(1.25rem,5.8vw,1.75rem)}
.qcard .big .cy{font-size:.5em;margin-top:6px}
.qcard .en{font-weight:800;font-size:1.15rem;color:var(--muted);margin-top:6px}
.qcard .eq{font-weight:900;color:var(--muted);margin:6px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{background:var(--card);color:var(--ink);border-radius:18px;padding:14px 10px;min-height:66px;font-weight:900;font-size:1.05rem;box-shadow:0 5px 0 var(--line);transition:transform .08s;min-width:0;overflow-wrap:anywhere}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.opt.right{background:var(--good);color:#fff;box-shadow:0 5px 0 #0f6a36;animation:pulse .3s}
.opt.right .cy{color:#d5f5e2}
.opt.wrong{background:var(--bad);color:#fff;box-shadow:0 5px 0 #8f1a14;animation:shake .35s}
.opt.wrong .cy{color:#ffd9d4}
.opt.dim{opacity:.45}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{min-height:78px;font-size:1.25rem}
.gap{display:inline-block;min-width:2.8em;border-bottom:4px solid var(--gold);line-height:1}
.gap.ok{border-color:var(--good);color:var(--good)}

/* match */
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:grid;gap:10px;align-content:start;min-width:0}
.tile{background:var(--card);color:var(--ink);border-radius:16px;padding:10px 8px;min-height:62px;font-weight:900;box-shadow:0 5px 0 var(--line);transition:opacity .25s, transform .12s;overflow-wrap:anywhere}
.tile.sel{background:var(--gold);box-shadow:0 5px 0 var(--gold-deep);transform:translateY(-2px)}
.tile.ok{background:var(--good);color:#fff;box-shadow:0 5px 0 #0f6a36;opacity:0;transform:scale(.85);pointer-events:none}
.tile.bad{background:var(--bad);color:#fff;box-shadow:0 5px 0 #8f1a14;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* build */
.line{min-height:70px;border-bottom:3px dashed rgba(255,255,255,.35);display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 12px;margin-bottom:16px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px}
.wt{background:var(--card);color:var(--ink);border-radius:14px;padding:8px 12px;font-weight:900;box-shadow:0 4px 0 var(--line);line-height:1.15}
.wt .cy{font-size:.7rem}
.wt.used{visibility:hidden}

/* feedback panel */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0;animation:up .18s cubic-bezier(.2,.8,.2,1)}
.fb .in{max-width:520px;margin:0 auto;display:grid;gap:10px}
.fb{max-height:78%;overflow:auto}
.fb.no{background:var(--bad-soft);color:var(--ink)}
.fb.ok{background:var(--good-soft);color:var(--ink)}
.fb h3{margin:0;font-size:1.2rem;font-weight:900}
.fb.no h3{color:var(--bad)}
.fb.ok h3{color:var(--good)}
.fb p{margin:0;font-weight:700}
.fb .ans{font-size:1.1rem}

/* results */
.res{text-align:center;padding-top:20px;display:grid;gap:14px}
.res h1{margin:0;font-size:2.2rem;font-weight:900;letter-spacing:.01em}
.res .sub{margin:0;color:var(--on-bg-muted);font-weight:800}
.bigstars{display:flex;justify-content:center;gap:6px;margin:4px 0}
.bigstars svg{width:64px;height:64px}
.bigstars .s2{transform:translateY(-14px)}
.bigstars .pop{animation:starpop .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes starpop{from{transform:scale(0) rotate(-40deg);opacity:0}}
.bigstars .s2.pop{animation-name:starpop2}
@keyframes starpop2{from{transform:translateY(-14px) scale(0) rotate(-40deg);opacity:0}to{transform:translateY(-14px)}}
.rcard{background:var(--card);color:var(--ink);border-radius:22px;padding:14px;display:grid;gap:12px;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rstats div{background:var(--card-2);border-radius:14px;padding:8px 4px;text-align:center;font-weight:900;font-size:1.25rem}
.rstats span{display:block;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lvup{background:var(--gold);color:var(--ink);border-radius:18px;padding:12px 14px;font-weight:900;animation:pulse .6s .3s}
.unlock{background:var(--good);color:#fff;border-radius:18px;padding:12px 14px;font-weight:900}
.newb{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.newb div{display:flex;align-items:center;gap:6px;background:var(--card-2);border-radius:12px;padding:6px 10px;font-weight:900;font-size:.9rem;color:var(--ink)}
.newb svg{width:20px;height:20px}
.miss h3{margin:0 0 4px;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.miss ul{list-style:none;margin:0;padding:0}
.miss li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.miss li > div{min-width:0}
.miss .en{color:var(--muted);font-weight:700;text-align:right}
.acts{display:grid;gap:12px;margin-top:4px}

/* badges + settings */
.ph{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ph h1{margin:0;font-size:1.5rem;font-weight:900}
.bgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.badge{background:var(--card);color:var(--ink);border-radius:18px;padding:14px 12px;display:grid;gap:6px;justify-items:center;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.18);min-width:0}
.badge .ic{width:56px;height:56px;border-radius:50%;background:var(--gold);box-shadow:inset 0 -4px 0 var(--gold-deep);display:grid;place-items:center}
.badge .ic svg{width:30px;height:30px}
.badge b{font-weight:900}
.badge span{font-size:.8rem;font-weight:700;color:var(--muted);line-height:1.25}
.badge.off{background:rgba(255,255,255,.08);color:var(--on-bg-muted);box-shadow:none}
.badge.off .ic{background:rgba(255,255,255,.12);box-shadow:none}
.badge.off span{color:var(--on-bg-muted);opacity:.8}
.panel{background:var(--card);color:var(--ink);border-radius:20px;padding:14px;display:grid;gap:10px;margin-bottom:12px}
.panel h2{margin:0;font-size:1.05rem;font-weight:900}
.panel p{margin:0;font-weight:600;color:var(--muted);font-size:.92rem;-webkit-user-select:text;user-select:text}
.panel ol{margin:0;padding-left:20px;font-weight:700;display:grid;gap:4px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.srow b{display:block}
.switch{width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-pressed="true"]{background:var(--good)}
.switch[aria-pressed="true"]::after{transform:translateX(20px)}
textarea{width:100%;min-height:84px;border-radius:14px;border:2px solid var(--line);padding:10px;font:inherit;font-size:.8rem;color:var(--ink);background:#fff;-webkit-user-select:text;user-select:text;resize:vertical}
.note{font-weight:800;font-size:.88rem}
.note.ok{color:var(--good)}
.note.no{color:var(--bad)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;background:var(--card);color:var(--ink);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:toast 2.8s forwards;max-width:calc(100% - 32px)}
.toast svg{width:26px;height:26px;flex:none}
.toast span{display:block;font-size:.78rem;color:var(--muted);font-weight:700}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-20px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.tile.bad .cy,.tile.sel .cy{color:inherit;opacity:.8}

.wrap{padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}</style>

const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mk = it => `<span class="mk">${esc(it.lat)}</span><span class="cy">${esc(it.cyr)}</span>`;
const fmt = n => Math.round(n).toLocaleString("en-CA");
const dayKey = (t=Date.now()) => { const d=new Date(t); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const toks = s => s.replace(/[.,!?]/g,"").split(/\s+/).filter(Boolean);
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
/* meaning of a single Macedonian word, for tap-to-define and mistake explanations */
function meaningOf(tok){
  const k = tok.toLowerCase().replace(/[.,!?]/g,"");
  if(WORD_BY_LAT[k]) return WORD_BY_LAT[k].en;
  if(GLOSS[k]) return GLOSS[k];
  return null;
}
/* a Macedonian sentence or phrase with every word tappable for its meaning */
function defLine(lat){
  return lat.split(/\s+/).map(w=>{ const m=meaningOf(w); return m?`<span class="def" data-def="${esc(w.replace(/[.,!?]/g,""))}">${esc(w)}</span>`:esc(w); }).join(" ");
}

/* ================= Saved progress (this device) ================= */
const KEY = "zbor-igra-v1";
function fresh(){ return {v:2, xp:0, units:{}, badges:{}, days:{}, blitzBest:0, rounds:0, perfect:0, bestCombo:0, fastestMatch:0,
  miss:{}, vocab:{}, learned:{}, bestStreak:0, cleared:0, cyr:true, openAll:false}; }
let G = Object.assign(fresh(), store.get(KEY, {}));
// units played before flashcards existed count as already studied
Object.entries(G.units).forEach(([id,r])=>{ if(r && r.plays>0) G.learned[id]=true; });
const save = () => store.set(KEY, G);
const U = id => G.units[id] || (G.units[id] = {stars:0, best:0, plays:0});
const unlocked = i => G.openAll || i===0 || (G.units[UNITS[i-1].id]||{}).stars>0;
const totalStars = () => UNITS.reduce((n,u)=>n+((G.units[u.id]||{}).stars||0),0);
const clearedUnits = () => UNITS.filter(u=>((G.units[u.id]||{}).stars||0)>0).length;
function streakDays(){
  let n=0, t=Date.now();
  if(!G.days[dayKey(t)]) t-=DAY;
  while(G.days[dayKey(t)]){ n++; t-=DAY; }
  return n;
}
const playedToday = () => !!G.days[dayKey()];
function nextUnit(){
  for(let i=0;i<UNITS.length;i++) if(unlocked(i) && !((G.units[UNITS[i].id]||{}).stars>0)) return i;
  for(let i=0;i<UNITS.length;i++) if(unlocked(i) && (G.units[UNITS[i].id]||{}).stars<3) return i;
  return 0;
}

/* ================= Vocabulary tracking ================= */
// new: never answered · learning: seen, not solid yet · known: right 3+ times with nothing outstanding · tricky: missed and not yet re-earned
function status(it){
  const v=G.vocab[it.key], m=G.miss[it.key]||0;
  if(!v) return "new";
  if(m>=1) return "tricky";
  if(v.c>=3 && m===0) return "known";
  return "learning";
}
const knownCount = () => ITEMS.filter(it=>status(it)==="known").length;
const trickyItems = () => ITEMS.filter(it=>(G.miss[it.key]||0)>0).sort((a,b)=>(G.miss[b.key]-G.miss[a.key])||((G.vocab[b.key]||{}).t-(G.vocab[a.key]||{}).t));
function noteAnswer(it, ok){
  if(!it) return;
  const v = G.vocab[it.key] || (G.vocab[it.key]={c:0,w:0,t:0});
  if(ok){ v.c++; if(G.miss[it.key]){ G.miss[it.key]--; if(!G.miss[it.key]){ delete G.miss[it.key]; G.cleared++; } } }
  else { v.w++; G.miss[it.key]=(G.miss[it.key]||0)+1; }
  v.t=Date.now();
}

const levelOf = xp => { let L=1; while(xp >= xpFor(L+1)) L++; return L; };

function checkBadges(){
  const L=levelOf(G.xp), st=totalStars(), cu=clearedUnits(), sd=Math.max(streakDays(), G.bestStreak), kn=knownCount();
  const tests = {
    first:G.rounds>=1, perfect:G.perfect>=1, combo10:G.bestCombo>=10, fast:G.fastestMatch>0&&G.fastestMatch<15,
    units5:cu>=5, units17:cu>=17, stars25:st>=25, stars51:st>=51, words50:kn>=50, words150:kn>=150, fixer:G.cleared>=10,
    blitz2k:G.blitzBest>=2000, days3:sd>=3, days7:sd>=7, days30:sd>=30, xp10k:G.xp>=10000, lvl10:L>=10
  };
  const got=[];
  BADGES.forEach(b=>{ if(tests[b.id] && !G.badges[b.id]){ G.badges[b.id]=Date.now(); got.push(b); } });

let popTimer=null;
function showDef(el){
  document.querySelectorAll(".defpop").forEach(p=>p.remove());
  const w=el.dataset.def, m=meaningOf(w); if(!m) return;
  const p=document.createElement("div"); p.className="defpop";
  p.innerHTML=`<b>${esc(w)}</b> ${esc(m)}`;
  document.body.appendChild(p);
  const r=el.getBoundingClientRect(), pw=p.offsetWidth, ph=p.offsetHeight;
  let x=r.left+r.width/2-pw/2; x=Math.max(10, Math.min(window.innerWidth-pw-10, x));
  let y=r.top-ph-10; if(y<10) y=r.bottom+10;
  p.style.left=x+"px"; p.style.top=y+"px";
  clearTimeout(popTimer); popTimer=setTimeout(()=>p.remove(), 2600);
}
document.addEventListener("click", e=>{
  const d=e.target.closest && e.target.closest("[data-def]");
  if(d){ showDef(d); return; }
  document.querySelectorAll(".defpop").forEach(p=>p.remove());
});

function drawTrail(){
  const map=document.getElementById("map"), svg=document.getElementById("trail"); if(!map||!svg) return;
  const r=map.getBoundingClientRect();
  const pts=[...map.querySelectorAll(".node")].map(n=>{const b=n.getBoundingClientRect(); return {x:b.left-r.left+b.width/2, y:b.top-r.top+b.height/2, rad:b.width/2};});
  svg.setAttribute("viewBox",`0 0 ${r.width} ${r.height}`);
  // leave each node from the side facing the next one and arrive at the top of the next, so the trail stays clear of the names
  let d=""; pts.slice(1).forEach((p,i)=>{ const q=pts[i], dir=p.x>=q.x?1:-1, sx=q.x+dir*(q.rad+6), ey=p.y-p.rad-8;

  svg.innerHTML=`<path d="${d}" fill="none" stroke="rgba(255,243,214,.28)" stroke-width="6" stroke-dasharray="2 14" stroke-linecap="round"/>`;
}

/* ================= Flashcards ================= */
function flashcards(ui, thenPlay){
  view="learn"; stopTimers();
  const u=UNITS[ui], deck=u.items; let k=0, flipped=false;
  const draw=()=>{
    const it=deck[k], last=k===deck.length-1, sent=it.kind==="s";
    app.innerHTML=`<div class="hud"><button class="quit" id="quit" aria-label="Close">${I.x}</button>
        <div class="rprog"><i style="width:${(k+1)/deck.length*100}%"></i></div><div class="num fcount">${k+1}/${deck.length}</div></div>
      <p class="qlabel">${thenPlay?"Learn these first":"Flashcards"} · ${esc(u.name)}</p>
      <div class="fcard ${flipped?"flip":""}" id="card" role="button" tabindex="0" aria-label="Flip card">
        <div class="face front"><span class="ftag">${sent?"Phrase":"Word"}</span><div class="big ${sent?"s":""}"><span class="mk">${esc(it.lat)}</span><span class="cy">${esc(it.cyr)}</span></div><p class="hint">Tap to see the meaning</p></div>
        <div class="face back"><span class="ftag">Meaning</span><div class="big ${sent?"s":""}" style="color:var(--ink)">${esc(it.en)}</div>
          <div class="fmk"><span class="mk">${sent?defLine(it.lat):esc(it.lat)}</span><span class="cy">${esc(it.cyr)}</span></div>
          ${sent?`<p class="hint">Tap a word to see what it means</p>`:""}</div>
      </div>
      <div class="two"><button class="btn cream" id="prev" ${k===0?"disabled":""}>Back</button>
        <button class="btn" id="nextc">${last?(thenPlay?"Start the round":"Done"):"Next"}</button></div>`;
    applyCyr();
    const card=document.getElementById("card");
    card.onclick=e=>{ if(e.target.closest("[data-def]")) return; flipped=!flipped; card.classList.toggle("flip", flipped); };
    card.onkeydown=e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); card.click(); } };
    document.getElementById("quit").onclick=home;
    document.getElementById("prev").onclick=()=>{ if(k>0){ k--; flipped=false; draw(); } };
    document.getElementById("nextc").onclick=()=>{
      if(!last){ k++; flipped=false; draw(); return; }
      G.learned[u.id]=true; save();
      thenPlay ? startRound(ui) : home();
    };
    let x0=null;
    card.addEventListener("touchstart",e=>{ x0=e.touches[0].clientX; },{passive:true});
    card.addEventListener("touchend",e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0; x0=null;
      if(Math.abs(dx)>60){ if(dx<0 && !last){ k++; flipped=false; draw(); } else if(dx>0 && k>0){ k--; flipped=false; draw(); } } });
  };
  draw();
}

/* ================= Challenge building ================= */
function pool(it){
  const same = UNITS[it.unit].items.filter(x=>x.kind===it.kind);
  const more = ITEMS.filter(x=>x.kind===it.kind && x.unit!==it.unit && unlocked(x.unit));
  const rest = ITEMS.filter(x=>x.kind===it.kind && x.unit!==it.unit && !unlocked(x.unit));
  return [...shuffle(same), ...shuffle(more), ...shuffle(rest)];
}
function options(it, n, field){
  const out=[it], used=new Set([it[field].toLowerCase()]);
  for(const x of pool(it)){ if(out.length>=n) break; const v=x[field].toLowerCase(); if(!used.has(v)){ used.add(v); out.push(x); } }
  return shuffle(out);
}
const STOP = new Set(["e","i","da","li","na","vo","so","se","mi","me","ja","ti","za","od","sum"]);
function makeCloze(it){
  const L=toks(it.lat), C=toks(it.cyr);
  const proper = i => i>0 && L[i][0]!==L[i][0].toLowerCase();
  let cand=L.map((t,i)=>i).filter(i=>L[i].length>=3 && !STOP.has(L[i].toLowerCase()) && !proper(i));
  if(!cand.length) cand=L.map((t,i)=>i);
  const gap=pick(cand), ans={lat:L[gap].toLowerCase(), cyr:(C[gap]||"").toLowerCase()};
  const inSent=new Set(L.map(t=>t.toLowerCase())), unitT=new Set(UNITS[it.unit].items.flatMap(x=>toks(x.lat).map(t=>t.toLowerCase())));
  const all=[], seen=new Set();
  ITEMS.filter(x=>unlocked(x.unit)||x.unit===it.unit).forEach(x=>{ const xl=toks(x.lat), xc=toks(x.cyr); xl.forEach((t,i)=>{ const k=t.toLowerCase(); if(i>0&&t[0]!==k[0]) return; if(!seen.has(k)&&!STOP.has(k)&&!inSent.has(k)){ seen.add(k); all.push({lat:k,cyr:(xc[i]||"").toLowerCase()}); } }); });
  const ranked=shuffle(all).sort((a,b)=>(unitT.has(b.lat)-unitT.has(a.lat))||(Math.abs(a.lat.length-ans.lat.length)-Math.abs(b.lat.length-ans.lat.length)));
  return {L, C, gap, ans, opts:shuffle([ans, ...ranked.slice(0,3)]), end:(it.lat.match(/[.?!]$/)||[""])[0], endC:(it.cyr.match(/[.?!]$/)||[""])[0]};
}
function buildTiles(it){
  const L=toks(it.lat), C=toks(it.cyr), tiles=L.map((t,i)=>({lat:t,cyr:C[i]||""}));
  const have=new Set(L.map(t=>t.toLowerCase())), extra=[];
  for(const x of shuffle(ITEMS.filter(x=>x.kind==="s"&&x!==it&&(x.unit===it.unit||unlocked(x.unit))))){
    toks(x.lat).forEach((t,i)=>{ if(extra.length<2 && !have.has(t.toLowerCase())){ have.add(t.toLowerCase()); extra.push({lat:t,cyr:toks(x.cyr)[i]||""}); } });
    if(extra.length>=2) break;
  }
  return shuffle([...tiles,...extra]).map((t,i)=>({...t,id:i}));
}
const LIMIT = {pickEn:10, pickMk:10, cloze:20, build:30, match:45};
function makeCh(type, it, extra={}){
  const c={type, it, limit:LIMIT[type], ...extra};
  if(type==="pickEn") c.opts=options(it, it.kind==="s"?3:4, "en");
  if(type==="pickMk") c.opts=options(it, it.kind==="s"?3:4, "lat");
  if(type==="cloze") c.cloze=makeCloze(it);
  if(type==="build") c.tiles=buildTiles(it);
  return c;
}
const matchCh = group => ({type:"match", group, limit:LIMIT.match});
const weakFirst = arr => [...arr].sort((a,b)=>((G.miss[b.key]||0)+Math.random()*1.5)-((G.miss[a.key]||0)+Math.random()*1.5));
function board(primary, fillers){
  const g=[], seenEn=new Set();
  for(const x of [...primary, ...fillers]){ if(g.length>=5) break; const e=x.en.toLowerCase(); if(!seenEn.has(e) && !g.includes(x)){ g.push(x); seenEn.add(e); } }
  return g;
}
/* a round is mostly match boards, finish-the-sentence and build-the-sentence, with a couple of quick picks for variety */
function buildRound(ui){
  const u=UNITS[ui];
  const W=weakFirst(u.items.filter(x=>x.kind==="w")), S=shuffle(u.items.filter(x=>x.kind==="s"));
  const review=weakFirst(ITEMS.filter(x=>x.unit<ui && unlocked(x.unit) && x.kind==="w"));
  const b1=board(W.slice(0,5), W.slice(5)), rest=W.filter(x=>!b1.includes(x));
  const b2=board(rest, [...review.slice(0,3), ...W]);
  const out=[];
  if(S.length){
    out.push(matchCh(b1));
    out.push(makeCh("pickEn", rest[0]||W[0]));
    out.push(makeCh("cloze", S[0]));
    out.push(makeCh("build", S[1%S.length]));
    out.push(matchCh(b2));
    out.push(makeCh("cloze", S[2%S.length]));
    out.push(makeCh("build", S[3%S.length]));
    out.push(makeCh("pickMk", review[0]||W[1]));
    out.push(makeCh("cloze", S[4%S.length]));
    out.push(makeCh("build", S[5%S.length]));
  } else {
    const b3=board(shuffle(W), review.slice(3));
    out.push(matchCh(b1)); out.push(makeCh("pickEn", W[0])); out.push(matchCh(b2));
    out.push(makeCh("pickMk", W[1])); out.push(matchCh(b3)); out.push(makeCh("pickEn", W[2])); out.push(makeCh("pickMk", W[3]));
  }
  return out;
}
function buildReview(){
  const tr=trickyItems().slice(0,12), w=tr.filter(x=>x.kind==="w"), s=tr.filter(x=>x.kind==="s"), out=[];
  for(let i=0;i<w.length;i+=5){
    const grp=w.slice(i,i+5);
    if(grp.length>=3) out.push(matchCh(board(grp, [])));
    grp.forEach((it,j)=>out.push(makeCh(j%2?"pickMk":"pickEn", it)));
  }
  s.forEach((it,j)=>out.push(makeCh(j%2?"build":"cloze", it)));
  return out;
}

/* ================= Round engine ================= */
let R=null, tmr=null;
function stopTimers(){ if(tmr){ clearTimeout(tmr); tmr=null; } if(R&&R.blitzTick){ clearInterval(R.blitzTick); R.blitzTick=null; } document.querySelectorAll(".fb,.scrim,.defpop").forEach(e=>e.remove()); }
const mult = c => c>=10?4:c>=6?3:c>=3?2:1;
function startRound(ui){
  stopTimers();
  R={mode:"unit", ui, ch:buildRound(ui), i:0, hearts:3, score:0, combo:0, best:0, correct:0, answered:0, missed:[], t0:Date.now()};
  view="round"; renderCh();
}
function startReview(){
  stopTimers();
  const ch=buildReview(); if(!ch.length) return home();
  R={mode:"review", relaxed:true, ch, i:0, hearts:3, score:0, combo:0, best:0, correct:0, answered:0, missed:[], before:trickyItems().length, clearedBefore:G.cleared, t0:Date.now()};
  view="round"; renderCh();
}
function hud(){
  const blitz=R.mode==="blitz";
  return `<div class="hud">
    <button class="quit" id="quit" aria-label="Quit">${I.x}</button>
    ${blitz?`<div class="rprog"><i id="btime" style="width:100%"></i></div>`:`<div class="rprog"><i style="width:${R.i/R.ch.length*100}%"></i></div>`}
    ${R.relaxed?`<div class="relaxtag">Review</div>`:blitz?"":`<div class="hearts" id="hearts">${[0,1,2].map(n=>`<span class="${n<R.hearts?"":"lost"}">${I.heart(n<R.hearts)}</span>`).join("")}</div>`}
  </div>
  <div class="scorebox"><div class="score num" id="score">${fmt(R.score)}<small>pts</small></div>
    <div class="combo ${R.combo>=3?"on":""}" id="combo">${I.bolt}<span id="comboTxt">x${mult(R.combo)}</span></div></div>
  ${blitz||R.relaxed?"":`<div class="timer"><i id="tbar"></i></div>`}`;
}
/* question timer that can pause while a mistake is explained */
function runTimer(ms){
  const bar=document.getElementById("tbar");
  R.tEnd=Date.now()+ms;
  if(bar){ const from=ms/R.tTotal*100; bar.style.transition="none"; bar.style.width=from+"%"; bar.offsetWidth;
    bar.style.transition=`width ${ms/1000}s linear`; bar.style.width="0%"; bar.classList.toggle("low", from<30);
    clearTimeout(R.lowT); R.lowT=setTimeout(()=>bar.classList.add("low"), Math.max(0, ms-R.tTotal*0.3)); }
  if(tmr) clearTimeout(tmr);
  tmr=setTimeout(()=>{ tmr=null; R.tLeft=0; const f=R.tOut; R.tOut=null; f&&f(); }, ms);
}
function startTimer(sec, onOut){ if(R.relaxed||R.mode==="blitz"){ R.tTotal=0; return; } R.tTotal=sec*1000; R.tOut=onOut; runTimer(R.tTotal); }
function pauseTimer(){
  if(!tmr) return; clearTimeout(tmr); tmr=null; clearTimeout(R.lowT);
  R.tLeft=Math.max(0,R.tEnd-Date.now());
  const bar=document.getElementById("tbar"); if(bar){ const w=getComputedStyle(bar).width; bar.style.transition="none"; bar.style.width=w; }
}
function resumeTimer(){ if(R && R.tOut && R.tLeft>0 && !tmr) runTimer(R.tLeft); }
function freezeTimer(){ pauseTimer(); if(R) R.tOut=null; }
const speedFrac = () => { if(!R.tTotal) return R.mode==="blitz"?1:0.5; const left = tmr ? R.tEnd-Date.now() : (R.tLeft||0); return Math.max(0, left/R.tTotal); };
function setScore(){ const s=document.getElementById("score"); if(s) s.innerHTML=`${fmt(R.score)}<small>pts</small>`;
  const c=document.getElementById("combo"); if(c){ c.classList.toggle("on", R.combo>=3); document.getElementById("comboTxt").textContent="x"+mult(R.combo); c.classList.remove("pulse"); void c.offsetWidth; if(R.combo>=3) c.classList.add("pulse"); } }
function floater(txt){ const f=document.createElement("div"); f.className="floater num"; f.textContent=txt; document.body.appendChild(f); setTimeout(()=>f.remove(),900); }
function gain(base, it){
  R.combo++; R.best=Math.max(R.best,R.combo); R.correct++; R.answered++;
  const pts=Math.round(base*mult(R.combo)); R.score+=pts; floater("+"+pts); setScore();
  noteAnswer(it, true);
  return pts;
}
function miss(it){
  R.combo=0; R.answered++;
  if(it){ if(!R.missed.includes(it)) R.missed.push(it); noteAnswer(it, false); }
  if(R.mode==="blitz"){ R.endAt-=3000; floater("−3 s"); setScore(); return; }
  if(R.relaxed){ setScore(); return; }
  R.hearts--; setScore();
  const h=document.getElementById("hearts"); if(h){ const sp=h.children[R.hearts]; if(sp){ sp.classList.add("lost","hit"); sp.innerHTML=I.heart(false); } }
}
function next(){
  document.querySelectorAll(".fb,.defpop").forEach(e=>e.remove());
  if(R.mode==="blitz"){ renderCh(); return; }
  if(R.hearts<=0) return endRound(false);
  R.i++; R.i<R.ch.length ? renderCh() : endRound(true);
}
/* explain a mistake: the right answer, and what the wrong pick actually means. Waits for Continue. */
const line = (cls, html) => `<div class="fbl ${cls}"><i>${cls==="ok"?"✓":"✗"}</i><div>${html}</div></div>`;
const pair = (it) => `<span class="mk">${it.kind==="s"?defLine(it.lat):`<span class="def" data-def="${esc(it.lat)}">${esc(it.lat)}</span>`}</span> <span class="cy">${esc(it.cyr)}</span> <span class="eq">means</span> <b>${esc(it.en)}</b>`;
function explain(title, lines, onContinue){
  if(R.mode==="blitz"){ R.pausedLeft=R.endAt-Date.now(); clearInterval(R.blitzTick); R.blitzTick=null; }
  const fb=document.createElement("div"); fb.className="fb no";
  const last = R.mode!=="blitz" && !R.relaxed && R.hearts<=0;
  fb.innerHTML=`<div class="in"><h3>${esc(title)}</h3>${lines.join("")}<p class="tip">Tap any Macedonian word to see its meaning.</p><button class="btn danger" id="cont">${last?"See results":"Continue"}</button></div>`;
  document.body.appendChild(fb); applyCyr();
  const b=fb.querySelector("#cont"); b.focus();
  b.onclick=()=>{ fb.remove(); document.querySelectorAll(".defpop").forEach(p=>p.remove());
    if(R.mode==="blitz"){ R.endAt=Date.now()+R.pausedLeft; R.pausedLeft=null; startBlitzClock(); }
    (onContinue||next)(); };
}

function renderCh(){
  if(R.mode==="blitz"){ R.cur = blitzCh(); }
  const c = R.mode==="blitz" ? R.cur : R.ch[R.i];
  const fn={pickEn:rPick, pickMk:rPick, cloze:rCloze, build:rBuild, match:rMatch}[c.type];
  app.innerHTML = hud() + `<div id="stage"></div>`;
  document.getElementById("quit").onclick = ()=>{ if(R.answered) endRound(false, true); else home(); };
  fn(c, document.getElementById("stage"));
  applyCyr();
}

/* pick the meaning / pick the Macedonian */
function rPick(c, st){
  const it=c.it, toEn=c.type==="pickEn", sent=it.kind==="s";
  // a single-word prompt is the question itself, so only sentence prompts get tap-to-define
  const prompt = toEn ? `<div class="big ${sent?"s":""}"><span class="mk">${sent?defLine(it.lat):esc(it.lat)}</span><span class="cy">${esc(it.cyr)}</span></div>` : `<div class="big ${sent?"s":""}">${esc(it.en)}</div>`;
  st.innerHTML=`<p class="qlabel">${toEn?"What does this mean?":"Pick the Macedonian"}</p>
    <div class="qcard">${prompt}</div>
    <div class="opts ${sent?"one":""}">${c.opts.map((o,k)=>`<button class="opt" data-k="${k}">${toEn?esc(o.en):mk(o)}</button>`).join("")}</div>`;
  const btns=[...st.querySelectorAll(".opt")];
  const done=k=>{
    const frac=speedFrac(); freezeTimer(); btns.forEach(b=>b.disabled=true);
    const right=c.opts.indexOf(it), ok=k===right;
    btns[right].classList.add("right"); btns.forEach((b,i)=>{ if(i!==right&&i!==k) b.classList.add("dim"); });
    if(ok){ gain(100+50*frac, it); setTimeout(next, R.mode==="blitz"?350:650); return; }
    if(k>=0) btns[k].classList.add("wrong");
    miss(it);
    const lines=[line("ok", pair(it))];
    if(k>=0){ const o=c.opts[k]; lines.push(line("no", toEn?`You picked <b>${esc(o.en)}</b>. In Macedonian that's ${`<span class="mk"><span class="def" data-def="${esc(o.lat)}">${esc(o.lat)}</span></span>`} <span class="cy">${esc(o.cyr)}</span>`:`You picked ${pair(o)}`)); }
    explain(k<0?"Time's up":"Not quite", lines);
  };
  btns.forEach((b,k)=>b.onclick=()=>done(k));
  startTimer(c.limit, ()=>done(-1));
}
/* finish the sentence */
function rCloze(c, st){
  const it=c.it, z=c.cloze;
  const lineHTML=(T,end,fill,tappable)=>T.map((t,i)=>i===z.gap?`<span class="gap ${fill?"ok":""}">${fill?esc(fill):"&nbsp;"}</span>`:(tappable&&meaningOf(t)?`<span class="def" data-def="${esc(t)}">${esc(t)}</span>`:esc(t))).join(" ")+esc(end);
  st.innerHTML=`<p class="qlabel">Finish the sentence</p>
    <div class="qcard"><div class="big s"><span class="mk" id="zl">${lineHTML(z.L,z.end,null,true)}</span><span class="cy">${lineHTML(z.C,z.endC)}</span></div><div class="en">${esc(it.en)}</div></div>
    <div class="opts">${z.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="mk">${esc(o.lat)}</span><span class="cy">${esc(o.cyr)}</span></button>`).join("")}</div>`;
  const btns=[...st.querySelectorAll(".opt")];
  const done=k=>{
    const frac=speedFrac(); freezeTimer(); btns.forEach(b=>b.disabled=true);
    const right=z.opts.indexOf(z.ans), ok=k===right;
    btns[right].classList.add("right"); document.getElementById("zl").innerHTML=lineHTML(z.L,z.end,z.L[z.gap],true);
    if(ok){ gain(120+60*frac, it); setTimeout(next, 1000); return; }
    if(k>=0) btns[k].classList.add("wrong");
    miss(it);
    const a=z.ans, am=meaningOf(a.lat), lines=[line("ok", `The missing word is <span class="mk">${esc(a.lat)}</span> <span class="cy">${esc(a.cyr)}</span>${am?` <span class="eq">means</span> <b>${esc(am)}</b>`:""}`)];
    if(k>=0){ const o=z.opts[k], om=meaningOf(o.lat); lines.push(line("no", `You picked <span class="mk">${esc(o.lat)}</span> <span class="cy">${esc(o.cyr)}</span>${om?` <span class="eq">means</span> <b>${esc(om)}</b>`:""}`)); }
    lines.push(line("ok", pair(it)));
    explain(k<0?"Time's up":"Not quite", lines);
  };
  btns.forEach((b,k)=>b.onclick=()=>done(k));
  startTimer(c.limit, ()=>done(-1));
}
/* tap to write the sentence */
function rBuild(c, st){
  const it=c.it, chosen=[];
  st.innerHTML=`<p class="qlabel">Tap to write it in Macedonian</p>
    <div class="qcard"><div class="big s">${esc(it.en)}</div></div>
    <div class="line" id="line"></div>
    <div class="bank" id="bank">${c.tiles.map(t=>`<button class="wt" data-id="${t.id}"><span class="mk">${esc(t.lat)}</span><span class="cy">${esc(t.cyr)}</span></button>`).join("")}</div>
    <button class="btn" id="check" disabled>Check</button>`;
  const lineEl=st.querySelector("#line"), check=st.querySelector("#check");
  const draw=()=>{ lineEl.innerHTML=chosen.map(id=>{const t=c.tiles[id]; return `<button class="wt" data-back="${id}"><span class="mk">${esc(t.lat)}</span><span class="cy">${esc(t.cyr)}</span></button>`;}).join(""); applyCyr();
    lineEl.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{ const id=+b.dataset.back; chosen.splice(chosen.indexOf(id),1); st.querySelector(`#bank [data-id="${id}"]`).classList.remove("used"); draw(); });
    check.disabled=!chosen.length; };
  st.querySelectorAll("#bank .wt").forEach(b=>b.onclick=()=>{ if(b.classList.contains("used")) return; chosen.push(+b.dataset.id); b.classList.add("used"); draw(); });
  const done=timeout=>{
    const frac=speedFrac(); freezeTimer(); st.querySelectorAll(".wt").forEach(b=>b.disabled=true); check.disabled=true;
    const built=chosen.map(id=>c.tiles[id].lat);
    const ok=!timeout && built.map(t=>t.toLowerCase()).join(" ")===toks(it.lat).map(t=>t.toLowerCase()).join(" ");
    if(ok){ gain(150+75*frac, it); lineEl.querySelectorAll(".wt").forEach(w=>w.classList.add("good")); setTimeout(next, 1000); return; }
    miss(it);
    const lines=[line("ok", pair(it))];
    if(built.length) lines.push(line("no", `You wrote <span class="mk">${defLine(built.join(" "))}</span>`));
    explain(timeout?"Time's up":"Not quite", lines);
  };
  check.onclick=()=>done(false);
  startTimer(c.limit, ()=>done(true));
}
/* match the words */
function rMatch(c, st){
  const g=c.group, s={sel:null, left:g.length, t0:Date.now(), over:false, bad:new Set()};
  st.innerHTML=`<p class="qlabel">Match the words</p>
    <div class="board"><div class="col">${shuffle(g).map(it=>`<button class="tile" data-side="L" data-key="${it.key}">${mk(it)}</button>`).join("")}</div>
    <div class="col">${shuffle(g).map(it=>`<button class="tile" data-side="R" data-key="${it.key}">${esc(it.en)}</button>`).join("")}</div></div>`;
  const finish=timeout=>{
    if(s.over) return; s.over=true; freezeTimer();
    if(timeout){
      const leftItems=g.filter(it=>!st.querySelector(`.tile[data-side="L"][data-key="${it.key}"]`).classList.contains("ok"));
      leftItems.forEach(it=>{ R.missed.includes(it)||R.missed.push(it); noteAnswer(it,false); });
      miss(null);
      explain("Time's up", leftItems.map(it=>line("ok", pair(it))));
      return;
    }
    const secs=(Date.now()-s.t0)/1000;
    if(!R.relaxed){
      const bonus=Math.round(Math.max(0, c.limit-secs)*10);
      if(bonus){ R.score+=bonus; setTimeout(()=>floater("Speed +"+bonus), 250); setScore(); }
      if(!s.bad.size && (!G.fastestMatch || secs<G.fastestMatch)) G.fastestMatch=Math.round(secs*10)/10;
    }
    setTimeout(next, 800);
  };
  st.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{
    if(s.over || t.classList.contains("ok")) return;
    if(!s.sel || s.sel.dataset.side===t.dataset.side){ if(s.sel) s.sel.classList.remove("sel"); s.sel = s.sel===t?null:t; if(s.sel) t.classList.add("sel"); return; }
    const a=s.sel; s.sel=null; a.classList.remove("sel");
    if(a.dataset.key===t.dataset.key){
      [a,t].forEach(x=>x.classList.add("ok")); s.left--;
      const it=ITEM[t.dataset.key];
      if(s.bad.has(it.key)){ R.combo++; R.best=Math.max(R.best,R.combo); setScore(); } else gain(50, it);
      if(!s.left) finish(false);
    } else {
      [a,t].forEach(x=>{ x.classList.remove("bad"); void x.offsetWidth; x.classList.add("bad"); setTimeout(()=>x.classList.remove("bad"),400); });
      const mkTile=a.dataset.side==="L"?a:t, enTile=a.dataset.side==="L"?t:a;
      const A=ITEM[mkTile.dataset.key], B=ITEM[enTile.dataset.key];
      s.bad.add(A.key); miss(A);
      pauseTimer();
      explain(R.hearts<=0 && !R.relaxed ? "Out of hearts" : "Not a pair", [line("no", pair(A)), line("no", `<b>${esc(B.en)}</b> in Macedonian is <span class="mk"><span class="def" data-def="${esc(B.lat)}">${esc(B.lat)}</span></span> <span class="cy">${esc(B.cyr)}</span>`)],
        ()=>{ if(!R.relaxed && R.hearts<=0){ s.over=true; return endRound(false); } resumeTimer(); });
    }
  });
  startTimer(c.limit, ()=>finish(true));
}

/* ================= Blitz ================= */
function blitzCh(){
  const pool=ITEMS.filter(x=>x.kind==="w" && unlocked(x.unit));
  const it = Math.random()<.35 ? weakFirst(pool)[0] : pick(pool);
  return makeCh(pick(["pickEn","pickEn","pickMk"]), it);
}
function startBlitzClock(){
  if(R.blitzTick) clearInterval(R.blitzTick);
  R.blitzTick=setInterval(()=>{
    const left=Math.max(0,R.endAt-Date.now()), b=document.getElementById("btime");
    if(b){ b.style.width=(left/600)+"%"; b.style.background = left<10000?"#ff7a4d":"var(--card)"; }
    if(left<=0){ clearInterval(R.blitzTick); R.blitzTick=null; endRound(true); }
  }, 100);
}
function startBlitz(){
  stopTimers();
  R={mode:"blitz", hearts:3, score:0, combo:0, best:0, correct:0, answered:0, missed:[], endAt:Date.now()+60000, t0:Date.now()};
  view="round"; renderCh(); startBlitzClock();
}

/* ================= Results ================= */
function endRound(success, quit=false){
  stopTimers();
  view="result";
  const Lb=levelOf(G.xp);
  G.xp+=R.score; G.bestCombo=Math.max(G.bestCombo,R.best);
  if(R.answered){ G.days[dayKey()]=(G.days[dayKey()]||0)+1; G.bestStreak=Math.max(G.bestStreak, streakDays()); }
  let stars=0, unlockedNew=null, newBest=false;
  if(R.mode==="unit"){
    const u=UNITS[R.ui], rec=U(u.id); rec.plays++;
    if(success && !quit){
      G.rounds++; stars=Math.max(1,R.hearts); if(R.hearts===3) G.perfect++;
      const wasOpen = R.ui+1<UNITS.length ? unlocked(R.ui+1) : true;
      rec.stars=Math.max(rec.stars, stars);
      if(!wasOpen && unlocked(R.ui+1)) unlockedNew=UNITS[R.ui+1];
    }
    if(R.score>rec.best){ rec.best=R.score; newBest=rec.plays>1; }
  } else if(R.mode==="blitz"){
    if(R.score>G.blitzBest){ newBest=G.blitzBest>0; G.blitzBest=R.score; }
  }
  const La=levelOf(G.xp), got=checkBadges(); save();
  const acc = R.answered ? Math.round(R.correct/R.answered*100) : 0;
  const clearedNow = R.mode==="review" ? G.cleared-R.clearedBefore : 0;
  const head = R.mode==="blitz" ? ["Vreme!","Time's up"]
    : R.mode==="review" ? ["Bravo!", clearedNow?`${clearedNow} word${clearedNow===1?"":"s"} cleared from your tricky list`:"Review done"]
    : quit ? ["Pauza","Round stopped"] : success ? (R.hearts===3?["Sovrsheno!","Perfect round"]:["Bravo!","Round cleared"]) : ["Ajde pak!","Out of hearts. Try again"];
  const ni = R.mode==="unit" ? nextUnit() : null;
  const label = R.mode==="unit" ? esc(UNITS[R.ui].name) : R.mode==="blitz" ? "Blitz" : "Tricky words";
  const trLeft = trickyItems().length;
  app.innerHTML=`<div class="res">
    <div><h1>${head[0]}</h1><p class="sub">${head[1]} · ${label}</p></div>
    ${R.mode==="unit"?`<div class="bigstars">${[1,2,3].map(n=>`<span class="s${n} ${stars>=n?"pop":""}" style="animation-delay:${n*0.18}s">${I.star(stars>=n)}</span>`).join("")}</div>`:""}
    <div class="rcard">
      <div style="text-align:center"><div class="score num" style="font-size:2.4rem;color:var(--ink)" id="countup">0</div>
        <div style="font-weight:800;color:var(--muted)">${newBest?"New best score!":R.mode==="blitz"?`Best ${fmt(G.blitzBest)}`:"points"}</div></div>
      <div class="rstats"><div class="num">${acc}%<span>Accuracy</span></div><div class="num">${R.best}<span>Best combo</span></div><div class="num">${streakDays()}<span>Day streak</span></div></div>
      ${La>Lb?`<div class="lvup">Level up! You're now level ${La} · ${titleOf(La)[1]} (${titleOf(La)[2]})</div>`:""}
      ${unlockedNew?`<div class="unlock">New unit unlocked: ${esc(unlockedNew.name)}</div>`:""}
      ${got.length?`<div class="newb">${got.map(b=>`<div>${I[b.ic].replace(/#2b1608/g,"#c98b00")}${esc(b.name)}</div>`).join("")}</div>`:""}
      ${R.missed.length?`<div class="miss"><h3>Added to your tricky words</h3><ul>${R.missed.map(it=>`<li><div>${mk(it)}</div><div class="en">${esc(it.en)}</div></li>`).join("")}</ul></div>`:""}
    </div>
    <div class="acts">
      ${R.mode==="blitz"?`<button class="btn" id="again">Play Blitz again</button>`
        : R.mode==="review" ? (trLeft?`<button class="btn" id="again">Review again (${trLeft} left)</button>`:"")
        : success&&!quit ? (ni!==R.ui?`<button class="btn" id="nextU">Next: ${esc(UNITS[ni].name)}</button><button class="btn cream" id="again">Replay for ${stars<3?"3 stars":"a higher score"}</button>`:`<button class="btn" id="again">Play again${stars<3?" for 3 stars":""}</button>`)
        : `<button class="btn" id="again">Try again</button>`}
      ${R.mode!=="review" && trLeft ? `<button class="btn cream" id="rev">Review tricky words (${trLeft})</button>`:""}
      <button class="btn cream" id="home">Map</button>
    </div></div>`;
  applyCyr();
  const ui=R.ui, mode=R.mode;
  const ag=document.getElementById("again"); if(ag) ag.onclick=()=> mode==="blitz"?startBlitz():mode==="review"?startReview():startRound(ui);
  const nx=document.getElementById("nextU"); if(nx) nx.onclick=()=>enterUnit(ni);
  const rv=document.getElementById("rev"); if(rv) rv.onclick=startReview;
  document.getElementById("home").onclick=home;
  const el=document.getElementById("countup"), target=R.score, t0=performance.now();
  const step=t=>{ const p=Math.min(1,(t-t0)/900); el.textContent=fmt(target*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
  got.forEach((b,i)=>setTimeout(()=>toast(b), 600+i*1200));
}

/* ================= My words ================= */
let wordsFilter="all";
function wordsView(){
  view="words"; stopTimers();
  const counts={known:0, learning:0, tricky:0, new:0}; ITEMS.forEach(it=>counts[status(it)]++);
  const show = it => wordsFilter==="all" || status(it)===wordsFilter;
  const tr=trickyItems().length;
  app.innerHTML=`<div class="ph"><button class="quit" id="back" aria-label="Back">${I.x}</button><h1>My words</h1></div>
    <div class="vgrid">
      <button class="vt known ${wordsFilter==="known"?"on":""}" data-f="known"><b class="num">${counts.known}</b><span>Known</span></button>
      <button class="vt learning ${wordsFilter==="learning"?"on":""}" data-f="learning"><b class="num">${counts.learning}</b><span>Learning</span></button>
      <button class="vt tricky ${wordsFilter==="tricky"?"on":""}" data-f="tricky"><b class="num">${counts.tricky}</b><span>Tricky</span></button>
      <button class="vt new ${wordsFilter==="new"?"on":""}" data-f="new"><b class="num">${counts.new}</b><span>Not yet</span></button>
    </div>
    <div class="vbar" aria-label="${counts.known} of ${ITEMS.length} known">${["known","learning","tricky"].map(k=>`<i class="${k}" style="width:${counts[k]/ITEMS.length*100}%"></i>`).join("")}</div>
    <p class="vnote">${counts.known} of ${ITEMS.length} words and phrases known. A word counts as known after 3 right answers with no recent misses.${wordsFilter!=="all"?` <button class="linkbtn" data-f="all">Show all</button>`:""}</p>
    ${tr?`<button class="btn" id="rev" style="margin-bottom:14px">Review tricky words (${tr})</button>`:""}
    ${UNITS.map(u=>{ const list=u.items.filter(show); if(!list.length) return "";
      return `<div class="panel"><h2>${esc(u.name)}</h2><ul class="wl">${list.map(it=>{ const v=G.vocab[it.key]; const st=status(it);
        return `<li><div>${mk(it)}</div><div class="en">${esc(it.en)}<i class="st ${st}">${st==="new"?"not yet":st}${v?` · ${v.c}✓ ${v.w}✗`:""}</i></div></li>`; }).join("")}</ul></div>`; }).join("") || `<p class="vnote">Nothing here yet.</p>`}`;
  applyCyr();
  document.getElementById("back").onclick=home;
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ wordsFilter = wordsFilter===b.dataset.f ? "all" : b.dataset.f; wordsView(); });
  const rv=document.getElementById("rev"); if(rv) rv.onclick=startReview;
}

/* ================= Badges screen ================= */
function badgesView(){
  view="badges";
  app.innerHTML=`<div class="ph"><button class="quit" id="back" aria-label="Back">${I.x}</button><h1>Badges</h1></div>
    <div class="bgrid">${BADGES.map(b=>{ const on=!!G.badges[b.id]; return `<div class="badge ${on?"":"off"}"><div class="ic">${on?I[b.ic]:I.lock.replace('stroke="currentColor"','stroke="rgba(255,243,214,.5)"').replace('fill="currentColor"','fill="rgba(255,243,214,.5)"')}</div><b>${esc(b.name)}</b><span>${esc(b.how)}</span></div>`; }).join("")}</div>`;
  document.getElementById("back").onclick=home;
}

/* ================= Settings ================= */
function settingsView(msg){
  view="settings";
  const standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone;
  app.innerHTML=`<div class="ph"><button class="quit" id="back" aria-label="Back">${I.x}</button><h1>Settings</h1></div>
    <div class="panel"><div class="srow"><div><b>Show Cyrillic</b><p>Small Cyrillic under each Macedonian word.</p></div><button class="switch" id="cyr" aria-pressed="${G.cyr}" aria-label="Show Cyrillic"></button></div></div>
    <div class="panel"><div class="srow"><div><b>Unlock every unit</b><p>Skip ahead on the map without earning stars first.</p></div><button class="switch" id="all" aria-pressed="${G.openAll}" aria-label="Unlock every unit"></button></div></div>
    ${standalone?"":`<div class="panel"><h2>Install on your iPhone</h2><ol><li>Open this page in Safari.</li><li>Tap the Share button, then “Add to Home Screen”.</li><li>Open Zbor Igra from its new icon. It runs full-screen and works offline.</li></ol></div>`}
    <div class="panel"><h2>Back up your progress</h2>
      <p>Progress is saved on this device. Copy this code somewhere safe (Notes works) to restore it on a new phone.</p>
      <textarea id="code" readonly aria-label="Backup code">${esc(btoa(unescape(encodeURIComponent(JSON.stringify(G)))))}</textarea>
      <button class="btn cream" id="copy">Copy backup code</button>
      <p style="margin-top:6px">To restore, paste a code here:</p>
      <textarea id="restore" placeholder="Paste a backup code" aria-label="Restore code"></textarea>
      <button class="btn cream" id="doRestore">Restore progress</button>
      ${msg?`<p class="note ${msg[0]}">${esc(msg[1])}</p>`:""}
    </div>
    <div class="panel" id="resetBox"><h2>Start over</h2><p>Erase your level, stars, streak, words and badges on this device.</p><button class="btn cream" id="reset">Reset progress</button></div>`;
  document.getElementById("back").onclick=home;
  document.getElementById("cyr").onclick=e=>{ G.cyr=!G.cyr; save(); e.currentTarget.setAttribute("aria-pressed",G.cyr); applyCyr(); };
  document.getElementById("all").onclick=e=>{ G.openAll=!G.openAll; save(); e.currentTarget.setAttribute("aria-pressed",G.openAll); };
  document.getElementById("copy").onclick=async()=>{
    const ta=document.getElementById("code");
    try{ await navigator.clipboard.writeText(ta.value); settingsView(["ok","Backup code copied."]); }
    catch(e){ ta.focus(); ta.select(); settingsView(["no","Couldn't copy automatically. Press and hold the code, then choose Copy."]); }
  };
  document.getElementById("doRestore").onclick=()=>{
    const v=document.getElementById("restore").value.trim();
    try{ const d=JSON.parse(decodeURIComponent(escape(atob(v)))); if(!d || typeof d.xp!=="number") throw 0; G=Object.assign(fresh(), d); save(); applyCyr(); settingsView(["ok","Progress restored."]); }
    catch(e){ settingsView(["no","That code didn't work. Check that you pasted all of it."]); }
  };
  document.getElementById("reset").onclick=()=>{
    document.getElementById("resetBox").innerHTML=`<h2>Erase everything?</h2><p>This can't be undone.</p><div class="two"><button class="btn cream" id="rNo">Keep it</button><button class="btn danger" id="rYes">Erase</button></div>`;
    document.getElementById("rNo").onclick=()=>settingsView();
    document.getElementById("rYes").onclick=()=>{ G=fresh(); save(); applyCyr(); home(); };
  };
}

/* ================= Pause clocks while the app is in the background ================= */
document.addEventListener("visibilitychange", ()=>{
  if(!R || view!=="round") return;
  if(document.visibilityState==="hidden"){
    if(R.mode==="blitz" && R.blitzTick){ R.bgLeft=R.endAt-Date.now(); clearInterval(R.blitzTick); R.blitzTick=null; }
    if(tmr){ pauseTimer(); R.bgPaused=true; }
  } else {
    if(R.mode==="blitz" && R.bgLeft!=null){ R.endAt=Date.now()+R.bgLeft; R.bgLeft=null; startBlitzClock(); }
    if(R.bgPaused){ R.bgPaused=false; resumeTimer(); }
  }
});

applyCyr();
home();
</script>
